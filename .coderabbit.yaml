language: ko-KR
tone_instructions: |
  프로젝트의 코드 품질 향상과 개발자의 성장을 목표로 리뷰.
  1. 심각한 문제와 사소한 문제를 명확히 구분하여 표시.
  2. 피드백은 명확하고 구체적으로 작성하며, 문제의 원인과 개선 방법을 제시.
  3. 리뷰는 교육적이어야 하며, 관련 개념을 함께 제공.
  4. 개선 중심의 제안을 우선.
reviews:
  profile: chill
  poem: false
  path_instructions:
    - path: 'src/**/*.{js,jsx}'
      instructions: |
        1. React 19, 모던 JavaScript(ES2020+) 기준으로 리뷰.
        2. 컴포넌트 분리, 상태 관리(useState/useEffect 오용, 불필요한 상태), props 설계, 재사용성, 클린코드를 확인.
        3. useEffect 의존성 배열 누락, 리스트 key 누락, 불필요한 리렌더링 등 React 실수를 확인.
        4. JavaScript 문법이 익숙하지 않은 개발자를 고려해, 더 나은 문법이 있으면 개념과 예시 코드를 함께 제시.
        5. 꼭 필요한 부분에 집중하고, 사소한 사항은 요약 코멘트에 모아서 설명.
    - path: 'src/**/*.css'
      instructions: |
        1. 다른 컴포넌트에 영향을 주는 전역 선택자 남용이 없는지 확인.
        2. 모바일 화면(QR 신고 페이지)에서 깨지지 않는 레이아웃인지 확인.
    - path: '**/*.test.{js,jsx}'
      instructions: |
        1. 테스트 네이밍이 명확한지 확인.
        2. 구현 세부사항이 아닌 사용자 동작 기준으로 테스트하는지 확인.
        3. 미작성한 테스트 케이스가 있다면 어떤 테스트가 필요한지 제안.
    - path: '{vite.config.js,.env*}'
      instructions: |
        1. 시크릿(비밀번호, API 키)이 포함되어 있지 않은지 확인. VITE_ 환경변수는 브라우저에 그대로 노출됨.
        2. 프록시, 환경별(development/production) 설정이 올바른지 확인.
  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - 'main'
      - 'develop'
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    semgrep:
      enabled: true
chat:
  auto_reply: true
